    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Creepster&display=swap" rel="stylesheet">

    <!--
      Auto-bust stale Vite module cache.
      When the browser has old cached @vite/client or @react-refresh that
      don't match the current dev server, module SyntaxErrors fire.
      This script catches those errors and forces one hard reload via a
      cache-busting URL, so the user never sees a blank page.
    -->
    <script>
      (function () {
        var BUST_KEY = '__liminal_bust__';
        // If we arrived via a bust redirect, clean the URL but mark success
        if (location.search.indexOf('_r=') !== -1) {
          history.replaceState(null, '', location.pathname + location.hash);
          sessionStorage.removeItem(BUST_KEY);
        }
        window.addEventListener('error', function (e) {
          var msg = e && e.message ? e.message : '';
          var isStaleModule =
            msg.indexOf('does not provide an export') !== -1 ||
            msg.indexOf('createHotContext') !== -1 ||
            msg.indexOf('injectIntoGlobalHook') !== -1 ||
            msg.indexOf('Failed to fetch dynamically imported') !== -1;
          if (isStaleModule && !sessionStorage.getItem(BUST_KEY)) {
            sessionStorage.setItem(BUST_KEY, '1');
            location.replace(location.pathname + '?_r=' + Date.now() + location.hash);
          }
        }, true);
        // Auto-clear flag after 6 s so future errors (if any) can retry
        setTimeout(function () { sessionStorage.removeItem(BUST_KEY); }, 6000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
